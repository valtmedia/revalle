version: '3.8'

services:
  # ============================================
  # Control Plane API
  # ============================================
  control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    container_name: proxy-control-plane
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "9090:9090"  # Prometheus metrics
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=proxy_admin
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-ProxySystem2024!}
      - MYSQL_DATABASE=proxy_system
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - LOG_LEVEL=info
      - BACKUP_DIR=/app/backups
      - DATA_DIR=/app/data
    volumes:
      - control-plane-data:/app/data
      - control-plane-backups:/app/backups
      - control-plane-logs:/app/logs
      - control-plane-certs:/app/certs
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - proxy-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ============================================
  # Redis - Session store and caching
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: proxy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-ProxyRedis2024!}
      --tcp-backlog 511
      --timeout 300
      --tcp-keepalive 300
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ProxyRedis2024!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proxy-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ============================================
  # MySQL - Persistent data storage
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: proxy-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-RootProxy2024!}
      - MYSQL_DATABASE=proxy_system
      - MYSQL_USER=proxy_admin
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-ProxySystem2024!}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./control-plane/migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
      --innodb_buffer_pool_size=128M
      --slow_query_log=1
      --long_query_time=2
      --slow_query_log_file=/var/lib/mysql/slow.log
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD:-RootProxy2024!}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - proxy-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ============================================
  # Squid Proxy Node (single instance for dev)
  # ============================================
  squid-proxy:
    build:
      context: ./squid-node
      dockerfile: Dockerfile
    container_name: proxy-squid-node
    restart: unless-stopped
    ports:
      - "3128:3128"
      - "3129:3129"  # SSL bump port
    environment:
      - CONTROL_PLANE_URL=http://control-plane:3000
      - NODE_NAME=squid-local-1
      - NODE_REGION=local
      - PROXY_PORT=3128
      - ADMIN_USER=${ADMIN_USERNAME:-admin}
      - ADMIN_PASS=${ADMIN_PASSWORD:-admin123}
    volumes:
      - squid-logs:/var/log/squid
      - squid-cache:/var/spool/squid
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "squidclient", "-h", "localhost", "-p", "3128", "mgr:info"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - proxy-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ============================================
  # Prometheus - Metrics collection
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: proxy-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - proxy-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ============================================
  # Grafana - Monitoring dashboard
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: proxy-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - proxy-network

  # ============================================
  # Dashboard (nginx serving static files)
  # ============================================
  dashboard:
    image: nginx:alpine
    container_name: proxy-dashboard
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./monitoring/nginx-dashboard.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      control-plane:
        condition: service_healthy
    networks:
      - proxy-network

  # ============================================
  # Log aggregation - Loki
  # ============================================
  loki:
    image: grafana/loki:latest
    container_name: proxy-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - proxy-network

  # ============================================
  # Promtail - Log shipper
  # ============================================
  promtail:
    image: grafana/promtail:latest
    container_name: proxy-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - control-plane-logs:/var/log/control-plane:ro
      - squid-logs:/var/log/squid:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - proxy-network

# ============================================
# Volumes
# ============================================
volumes:
  control-plane-data:
    driver: local
  control-plane-backups:
    driver: local
  control-plane-logs:
    driver: local
  control-plane-certs:
    driver: local
  redis-data:
    driver: local
  mysql-data:
    driver: local
  squid-logs:
    driver: local
  squid-cache:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  proxy-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

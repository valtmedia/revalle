# ===========================================
# Prometheus Configuration
# ===========================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: 'proxy-node-system'
    environment: 'production'

# ===========================================
# Alerting Rules
# ===========================================
rule_files:
  - "alert_rules.yml"

# ===========================================
# Scrape Configurations
# ===========================================
scrape_configs:
  # Control Plane metrics
  - job_name: 'control-plane'
    scrape_interval: 10s
    metrics_path: /api/metrics/prometheus
    static_configs:
      - targets: ['control-plane:3000']
        labels:
          service: 'control-plane'
          component: 'api'

  # Squid node metrics (discovered via control plane)
  - job_name: 'squid-nodes'
    scrape_interval: 30s
    metrics_path: /metrics
    http_sd_configs:
      - url: 'http://control-plane:3000/api/nodes/discovery'
        refresh_interval: 60s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Redis exporter (if available)
  - job_name: 'redis'
    scrape_interval: 30s
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'

  # MySQL exporter (if available)
  - job_name: 'mysql'
    scrape_interval: 30s
    static_configs:
      - targets: ['mysql-exporter:9104']
        labels:
          service: 'mysql'

  # Node exporter for system metrics
  - job_name: 'node-exporter'
    scrape_interval: 30s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'system'

# ===========================================
# Squid Proxy Configuration for Proxy Node System
# ===========================================

# Network Settings
http_port 3128
https_port 3129 cert=/etc/squid/ssl_cert/myCA.pem key=/etc/squid/ssl_cert/myCA.pem

# Authentication
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic children 5
auth_param basic realm ProxyNodeSystem
auth_param basic credentialsttl 2 hours
auth_param basic casesensitive on

# ACLs
acl authenticated proxy_auth REQUIRED
acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 21          # ftp
acl Safe_ports port 443         # https
acl Safe_ports port 70          # gopher
acl Safe_ports port 210         # wais
acl Safe_ports port 1025-65535  # unregistered ports
acl Safe_ports port 280         # http-mgmt
acl Safe_ports port 488         # gss-http
acl Safe_ports port 591         # filemaker
acl Safe_ports port 777         # multiling http
acl CONNECT method CONNECT
acl PURGE method PURGE

# Health check ACL
acl healthcheck url_regex ^http://localhost/health$
acl manager_page url_regex ^cache_object://localhost/
acl internal_net src 172.16.0.0/12
acl internal_net src 10.0.0.0/8
acl internal_net src 192.168.0.0/16

# Blacklist
acl blacklist dstdomain "/etc/squid/blacklist.acl"

# Access Control
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow PURGE localhost
http_access deny PURGE
http_access allow manager_page localhost
http_access allow manager_page internal_net
http_access deny manager_page
http_access allow healthcheck
http_access deny blacklist
http_access allow authenticated
http_access deny all

# Performance Settings
cache_mem 256 MB
maximum_object_size_in_memory 10 MB
maximum_object_size 512 MB
cache_replacement_policy lru
memory_replacement_policy lru

# Disk Cache
cache_dir ufs /var/spool/squid 10000 16 256
cache_swap_low 90
cache_swap_high 95

# DNS Settings
dns_v4_first on
dns_timeout 30 seconds
dns_retransmit_interval 5 seconds
positive_dns_ttl 6 hours
negative_dns_ttl 1 minutes

# Connection Settings
connect_timeout 60 seconds
peer_connect_timeout 30 seconds
read_timeout 15 minutes
request_timeout 5 minutes
persistent_request_timeout 2 minutes
client_lifetime 8 hours
half_closed_clients off
pconn_timeout 15 seconds
shutdown_lifetime 10 seconds

# Forwarding
forwarded_for delete
via off
follow_x_forwarded_for deny all
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
request_header_access Cache-Control deny all

# Reply headers
reply_header_access X-Cache deny all
reply_header_access X-Cache-Lookup deny all

# Logging
access_log daemon:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
cache_store_log /var/log/squid/store.log

# Log Format (extended with timing)
logformat proxynode %>a %[ui %[un [%tl] "%rm %ru HTTP/%rv" %>Hs %<st %Ss:%Sh %<a %{Referer}>h "%{User-Agent}>h" %tr

# Refresh Patterns
refresh_pattern ^ftp:           1440    20%     10080
refresh_pattern ^gopher:        1440    0%      1440
refresh_pattern -i (/cgi-bin/|\?) 0     0%      0
refresh_pattern .               0       20%     4320

# SNMP (optional)
# snmp_port 3401
# acl snmpcommunit snmp_community public
# snmp_access allow snmpcommunit localhost
# snmp_access deny all

# Miscellaneous
visible_hostname proxy-node
unique_hostname proxy-node
httpd_suppress_version_string on
uri_whitespace encode

# Coredump directory
coredump_dir /var/spool/squid

# Worker processes
workers 2

# Error pages
err_page_stylesheet /etc/squid/errorpage.css
